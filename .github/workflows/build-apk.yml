name: Build StayFlow APK (R8 + ProGuard)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystores for debug & release builds
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            CI_PASS="stayflow-ci-signing-key"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=StayFlow, OU=Sky, O=StayFlow, L=Jakarta, S=ID, C=ID"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Kotlin Typecheck & Unit/Robolectric Tests
        env:
          XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        env:
          XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build R8 + ProGuard Release APK
        env:
          XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StayFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (R8 Obfuscated)
        uses: actions/upload-artifact@v4
        with:
          name: StayFlow-release-r8-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 ProGuard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: StayFlow-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
